<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctors - MediCare HMS</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="sidebar"></div><main class="main">
<header class="topbar"><div><h1>Doctors</h1><p>Manage hospital doctors</p></div><button class="menu-btn" onclick="toggleSidebar()">☰</button></header>
<section class="panel"><h2>Add Doctor</h2><form id="doctorForm" class="form-grid">
<input name="name" placeholder="Doctor Name" required><input name="specialization" placeholder="Specialization" required>
<input name="phone" placeholder="Phone" required><input name="experience" type="number" min="0" placeholder="Experience (years)" required>
<select name="department" required><option value="">Department</option><option>Cardiology</option><option>Neurology</option><option>Orthopedics</option><option>General Medicine</option><option>Pediatrics</option><option>Dermatology</option></select>
<button class="btn primary" type="submit">Add Doctor</button></form></section>
<section class="panel"><div class="panel-head"><h2>Doctor List</h2><input id="doctorSearch" class="search" placeholder="Search doctor..." oninput="renderDoctors()"></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Specialization</th><th>Department</th><th>Experience</th><th>Phone</th><th>Action</th></tr></thead><tbody id="doctorTable"></tbody></table></div></section>
</main><script src="js/app.js"></script><script>setupDoctorPage();</script></body></html>
