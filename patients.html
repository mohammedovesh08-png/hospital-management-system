<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patients - MediCare HMS</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="sidebar"></div><main class="main">
<header class="topbar"><div><h1>Patients</h1><p>Register and manage patients</p></div><button class="menu-btn" onclick="toggleSidebar()">☰</button></header>
<section class="panel"><div class="panel-head"><h2>Patient Registration</h2></div>
<form id="patientForm" class="form-grid">
<input name="name" placeholder="Patient Name" required><input name="age" type="number" min="0" placeholder="Age" required>
<select name="gender" required><option value="">Gender</option><option>Male</option><option>Female</option><option>Other</option></select>
<input name="phone" placeholder="Phone Number" required><input name="disease" placeholder="Disease / Problem" required>
<input name="doctor" placeholder="Doctor Name" required><input name="admission" type="date" required>
<textarea name="address" placeholder="Address"></textarea><button class="btn primary" type="submit">Add Patient</button>
</form></section>
<section class="panel"><div class="panel-head"><h2>Patient List</h2><input id="patientSearch" class="search" placeholder="Search patient..." oninput="renderPatients()"></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Disease</th><th>Doctor</th><th>Action</th></tr></thead><tbody id="patientTable"></tbody></table></div></section>
</main><script src="js/app.js"></script><script>setupPatientPage();</script></body></html>
