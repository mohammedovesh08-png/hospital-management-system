<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointments - MediCare HMS</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="sidebar"></div><main class="main">
<header class="topbar"><div><h1>Appointments</h1><p>Schedule and manage appointments</p></div><button class="menu-btn" onclick="toggleSidebar()">☰</button></header>
<section class="panel"><h2>Book Appointment</h2><form id="appointmentForm" class="form-grid">
<input name="patient" placeholder="Patient Name" required><input name="doctor" placeholder="Doctor Name" required>
<input name="date" type="date" required><input name="time" type="time" required>
<select name="department" required><option value="">Department</option><option>Cardiology</option><option>Neurology</option><option>Orthopedics</option><option>General Medicine</option><option>Pediatrics</option><option>Dermatology</option></select>
<select name="status"><option>Confirmed</option><option>Pending</option><option>Completed</option><option>Cancelled</option></select>
<button class="btn primary" type="submit">Book Appointment</button></form></section>
<section class="panel"><div class="panel-head"><h2>Appointment List</h2><input id="appointmentSearch" class="search" placeholder="Search..." oninput="renderAppointments()"></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Department</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th></tr></thead><tbody id="appointmentTable"></tbody></table></div></section>
</main><script src="js/app.js"></script><script>setupAppointmentPage();</script></body></html>
