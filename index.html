<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCare HMS - Dashboard</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebar"></div>
<main class="main">
<header class="topbar"><div><h1>Dashboard</h1><p>Hospital Management System</p></div><button class="menu-btn" onclick="toggleSidebar()">☰</button></header>
<section class="cards">
<div class="card"><span>👥</span><div><p>Total Patients</p><h2 id="dashPatients">0</h2></div></div>
<div class="card"><span>🩺</span><div><p>Total Doctors</p><h2 id="dashDoctors">0</h2></div></div>
<div class="card"><span>📅</span><div><p>Appointments</p><h2 id="dashAppointments">0</h2></div></div>
<div class="card"><span>💳</span><div><p>Total Bills</p><h2 id="dashBills">0</h2></div></div>
</section>
<section class="panel">
<div class="panel-head"><h2>Recent Appointments</h2><a class="btn" href="appointments.html">View All</a></div>
<div class="table-wrap"><table><thead><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody id="recentAppointments"></tbody></table></div>
</section>
<section class="panel welcome"><h2>Welcome to MediCare</h2><p>Manage patients, doctors, appointments and billing from one simple dashboard.</p></section>
</main>
<script src="js/app.js"></script><script>renderDashboard();</script>
</body></html>
